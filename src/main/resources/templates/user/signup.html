<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가천대학교 학사행정 - 회원가입</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
        }

        body {
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .signup-container {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 40px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border: 1px solid #e1e4e8;
        }

        .signup-title {
            text-align: center;
            color: #003876;
            margin-bottom: 25px;
            font-size: 22px;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #444;
            margin-bottom: 6px;
        }

        .form-group input, .form-group select {
            width: 100%;
            height: 42px;
            padding: 0 12px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #003876;
        }

        .btn-submit {
            width: 100%;
            height: 46px;
            background-color: #0072ce;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background-color: #005bb5;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #666;
        }

        .login-link a {
            color: #0072ce;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="signup-container">
        <h2 class="signup-title">학생 회원가입</h2>
        
        <form id="signupForm">
            <div class="form-group">
                <label for="loginId">로그인 아이디 *</label>
                <input type="text" id="loginId" name="loginId" required placeholder="아이디 입력">
            </div>

            <div class="form-group">
                <label for="password">비밀번호 *</label>
                <input type="password" id="password" name="password" required placeholder="비밀번호 입력">
            </div>

            <div class="form-group">
                <label for="name">이름 *</label>
                <input type="text" id="name" name="name" required placeholder="이름 입력">
            </div>

            <div class="form-group">
                <label for="studentId">학번 *</label>
                <input type="text" id="studentId" name="studentId" required placeholder="학번 입력 (예: 202612345)">
            </div>

            <div class="form-group">
                <label for="age">나이</label>
                <input type="number" id="age" name="age" placeholder="나이">
            </div>

            <div class="form-group">
                <label for="phone">전화번호</label>
                <input type="text" id="phone" name="phone" placeholder="010-0000-0000">
            </div>

            <div class="form-group">
                <label for="email">이메일</label>
                <input type="email" id="email" name="email" placeholder="example@gachon.ac.kr">
            </div>

            <div class="form-group">
                <label for="grade">학년</label>
                <select id="grade" name="grade">
                    <option value="1">1학년</option>
                    <option value="2">2학년</option>
                    <option value="3">3학년</option>
                    <option value="4">4학년</option>
                </select>
            </div>

            <div class="form-group">
                <label for="major">전공</label>
                <input type="text" id="major" name="major" placeholder="컴퓨터공학과">
            </div>

            <button type="submit" class="btn-submit">가입하기</button>
        </form>

        <div class="login-link">
            이미 계정이 있으신가요? <a th:href="@{/main-view}">로그인으로 이동</a>
        </div>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const formData = {
                loginId: document.getElementById('loginId').value,
                password: document.getElementById('password').value,
                name: document.getElementById('name').value,
                studentId: document.getElementById('studentId').value,
                age: document.getElementById('age').value ? parseInt(document.getElementById('age').value) : null,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                grade: document.getElementById('grade').value ? parseInt(document.getElementById('grade').value) : null,
                major: document.getElementById('major').value
            };

            try {
                const response = await fetch('/api/users', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    alert('회원가입이 완료되었습니다!');
                    window.location.href = '/main-view';
                } else {
                    const errorMessage = await response.text();
                    alert('회원가입 실패: ' + errorMessage);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('서버 통신 중 오류가 발생했습니다.');
            }
        });
    </script>
</body>
